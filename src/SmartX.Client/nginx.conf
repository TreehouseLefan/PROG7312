server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly binaries
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the Blazor app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
